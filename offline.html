<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>Offline — Presensi</title>
  <style>
    :root {
      color-scheme: light dark;
      --brand: #2563eb;
      --bg: #f4f6fb;
      --surface: #ffffff;
      --ink: #0b1220;
      --muted: #64748b;
      --line: #e4eaf3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #070b14;
        --surface: #0d1424;
        --ink: #e9eefb;
        --muted: #93a2bd;
        --line: #1d2942;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 36px 28px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 24px 60px -32px rgba(15, 23, 42, .5);
    }
    .icon {
      width: 56px; height: 56px;
      margin: 0 auto 18px;
      border-radius: 18px;
      display: grid; place-items: center;
      background: color-mix(in srgb, var(--brand) 12%, transparent);
      color: var(--brand);
    }
    h1 { font-size: 20px; letter-spacing: -.02em; margin-bottom: 8px; }
    p { color: var(--muted); font-size: 13.5px; line-height: 1.6; }
    button {
      margin-top: 22px;
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 16px;
      background: var(--brand);
      color: #fff;
      font: inherit;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
    button:active { transform: scale(.98); }
    .hint { margin-top: 14px; font-size: 11.5px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22" />
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>
    </div>
    <h1>Tidak ada koneksi</h1>
    <p>Halaman ini belum tersimpan untuk mode offline. Periksa jaringan, lalu coba lagi.</p>
    <button onclick="location.reload()">Coba lagi</button>
    <p class="hint">Data absensi yang sudah dikirim tetap aman di server.</p>
  </div>
</body>
</html>

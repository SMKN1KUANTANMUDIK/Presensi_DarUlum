<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yayasan Darul Ulum Islamiyyah — Admin Portal</title>
  <meta name="theme-color" content="#0a4428">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css?v=21">
  <link rel="stylesheet" href="admin.css?v=21">

  <!-- External libs -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body>

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <div class="app">

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->
    <aside class="sidebar" id="sidebar">

      <div class="sidebar-header">
        <div class="logo-icon" id="app-logo-container">
          <img
            src="icon-192.png"
            alt="Logo Yayasan Darul Ulum Islamiyyah"
            onerror="this.src='icon-192.png';"
          >
        </div>
        <div class="logo-text">
          <h1 id="app-title">Darul Ulum Islamiyyah</h1>
          <p>Admin Portal</p>
        </div>
      </div>

      <nav class="nav" role="navigation" aria-label="Menu utama">
        <div class="nav-item active" data-page="dashboard"  onclick="showPage('dashboard')"  role="button" tabindex="0">
          <i data-lucide="home"></i><span>Dashboard</span>
        </div>
        <div class="nav-item" data-page="laporan"   onclick="showPage('laporan')"   role="button" tabindex="0">
          <i data-lucide="clipboard-check"></i><span>Laporan Kehadiran</span>
        </div>
        <div class="nav-item" data-page="rekap"     onclick="showPage('rekap')"     role="button" tabindex="0">
          <i data-lucide="calendar-range"></i><span>Rekap Bulanan</span>
        </div>
        <div class="nav-item" data-page="siswa"     onclick="showPage('siswa')"     role="button" tabindex="0">
          <i data-lucide="users"></i><span>Data Master</span>
        </div>
        <div class="nav-item" data-page="pengaturan" onclick="showPage('pengaturan')" role="button" tabindex="0">
          <i data-lucide="settings"></i><span>Pengaturan</span>
        </div>
        <div class="nav-item nav-logout" onclick="handleAdminLogout()" role="button" tabindex="0" title="Keluar dari Admin Portal">
          <i data-lucide="log-out"></i><span>Logout</span>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user-row">
          <div class="user">
            <div class="user-avatar" id="admin-avatar">BS</div>
            <div class="user-info">
              <span id="admin-name">Budi Santoso</span>
              <p id="admin-role">Administrator</p>
            </div>
          </div>
          <button class="sidebar-logout-icon-btn" onclick="handleAdminLogout()" title="Logout Admin" aria-label="Logout">
            <i data-lucide="log-out" style="width:16px;height:16px;"></i>
          </button>
        </div>
      </div>

    </aside><!-- /.sidebar -->


    <!-- =====================================================
         MAIN
    ====================================================== -->
    <main class="main" id="main">

      <!-- Topbar -->
      <div class="topbar">
        <div style="display:flex; align-items:center; gap:10px;">
          <button class="mobile-toggle" onclick="toggleSidebar()" aria-label="Buka/tutup menu">
            <i data-lucide="menu" style="width:24px;height:24px;"></i>
          </button>
          <h2 id="page-title">Dashboard</h2>
        </div>

        <div class="topbar-right">
          <div class="search-box">
            <i data-lucide="search" style="width:16px;color:var(--text-muted);"></i>
            <input
              type="search"
              id="topbar-search"
              placeholder="Cari nama / ID / barcode…"
              oninput="handleGlobalSearch(this.value)"
              aria-label="Cari"
            >
          </div>
          <button class="topbar-icon" onclick="showNotificationInfo()" title="Notifikasi" aria-label="Notifikasi">
            <i data-lucide="bell" style="width:20px;"></i>
          </button>
          <button class="topbar-icon" onclick="showPage('pengaturan')" title="Pengaturan" aria-label="Pengaturan">
            <i data-lucide="settings" style="width:20px;"></i>
          </button>
          <button class="topbar-logout-btn" onclick="handleAdminLogout()" title="Keluar">
            <i data-lucide="log-out" style="width:15px;height:15px;"></i>
            <span>Logout</span>
          </button>
        </div>
      </div><!-- /.topbar -->

      <!-- Dynamic content -->
      <div class="content" id="main-content"></div>

    </main><!-- /.main -->

  </div><!-- /.app -->


  <div class="modal-overlay" id="modal"></div>
  <div class="toast-container" id="toasts"></div>


  <!-- =====================================================
       SCRIPTS
  ====================================================== -->
  <script src="holidays.js?v=12"></script>
  <script src="api_connector.js?v=12"></script>
  <script src="admin.js?v=21"></script>

  <script>
    /* ---- PWA Service Worker ---- */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('[SW] Admin terdaftar:', reg.scope))
          .catch(err => console.error('[SW] Gagal:', err));
      });
    }
  </script>
</body>
</html>

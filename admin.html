<!DOCTYPE html>
<html>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <title>Yayasan Darul Ulum Islamiyyah - Admin Portal</title>
  <meta name="theme-color" content="#059669">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <script src='https://unpkg.com/lucide@latest'></script>
  <script src='https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js'></script>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'></script>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js'></script>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'></script>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<div class='sidebar-overlay' id='sidebar-overlay' onclick='toggleSidebar()'></div>
<div class='app'>
    <aside class='sidebar' id='sidebar'>
        <div class='sidebar-header'>
            <div class='logo-icon' id='app-logo-container'><img src='icon-192.png' alt='Logo Yayasan Darul Ulum' onerror="this.onerror=null;this.src='icon-192.png';" style='width:100%;height:100%;object-fit:contain;border-radius:8px;background:#ffffff;padding:2px;'></div>
            <div class='logo-text'><h1 id='app-title'>Darul Ulum Islamiyyah</h1><p>Admin Portal</p></div>
        </div>
        <nav class='nav'>
            <div class='nav-item active' data-page='dashboard' onclick='showPage("dashboard")'><i data-lucide='home'></i><span>Dashboard</span></div>
            <div class='nav-item' data-page='laporan' onclick='showPage("laporan")'><i data-lucide='clipboard-check'></i><span>Laporan Kehadiran</span></div>
            <div class='nav-item' data-page='rekap' onclick='showPage("rekap")'><i data-lucide='calendar-range'></i><span>Rekap Bulanan</span></div>
            <div class='nav-item' data-page='siswa' onclick='showPage("siswa")'><i data-lucide='users'></i><span>Data Master</span></div>
            <div class='nav-item' data-page='pengaturan' onclick='showPage("pengaturan")'><i data-lucide='settings'></i><span>Pengaturan</span></div>
            <div class='nav-item nav-logout' onclick='handleAdminLogout()' title='Keluar dari Admin Portal'><i data-lucide='log-out'></i><span>Logout</span></div>
        </nav>
        <div class='sidebar-footer'>
            <div class='sidebar-user-row'>
                <div class='user'>
                    <div class='user-avatar' id='admin-avatar'>BS</div>
                    <div class='user-info'><span id='admin-name'>Budi Santoso</span><p id='admin-role'>Administrator</p></div>
                </div>
                <button class='sidebar-logout-icon-btn' onclick='handleAdminLogout()' title='Logout Admin'>
                    <i data-lucide='log-out' style='width:16px;height:16px;'></i>
                </button>
            </div>
        </div>
    </aside>
    <main class='main'>
        <div class='topbar'>
            <div style="display:flex; align-items:center; gap:10px;">
                <button class='mobile-toggle' onclick='toggleSidebar()'><i data-lucide='menu' style='width:24px; height:24px;'></i></button>
                <h2 id='page-title'>Dashboard</h2>
            </div>
            <div class='topbar-right'>
                <div class='search-box'><i data-lucide='search' style='width:16px;color:var(--gray)'></i><input type='text' id='topbar-search' placeholder='Cari nama / ID / barcode...' oninput='handleGlobalSearch(this.value)'></div>
                <div class='topbar-icon' onclick='showNotificationInfo()' title='Notifikasi'><i data-lucide='bell' style='width:20px'></i></div>
                <div class='topbar-icon' onclick='showPage("pengaturan")' title='Pengaturan'><i data-lucide='settings' style='width:20px'></i></div>
                <button class='topbar-logout-btn' onclick='handleAdminLogout()' title='Keluar dari Admin Portal'>
                    <i data-lucide='log-out' style='width:15px;height:15px;'></i>
                    <span>Logout</span>
                </button>
            </div>
        </div>
        <div class='content' id='main-content'></div>
    </main>
</div>
<div class='modal-overlay' id='modal'></div>
<div class='toast-container' id='toasts'></div>

<script src="holidays.js?v=7"></script>
<script src="api_connector.js?v=7"></script>
<script src="admin.js?v=7"></script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW terdaftar di admin!', reg.scope))
                .catch(err => console.error('SW gagal:', err));
        });
    }
</script>
</body>
</html>

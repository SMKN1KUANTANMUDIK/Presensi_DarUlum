<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presensi — SMKN 1 Kuantan Mudik</title>
  <script>
    // SPA fallback: arahkan semua 404 ke index.html agar React Router menangani routing
    var path = window.location.pathname;
    if (path !== '/') {
      var base = window.location.origin + window.location.pathname.split('/').slice(0, -1).join('/') + '/';
      window.location.replace(base + 'index.html#' + path);
    } else {
      window.location.replace('index.html');
    }
  </script>
</head>
<body>
  <p>Dialihkan…</p>
</body>
</html>

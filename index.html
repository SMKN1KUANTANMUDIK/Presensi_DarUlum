<!DOCTYPE html>
<html>

<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <title>Yayasan Darul Ulum Islamiyyah - Portal Absensi</title>
  <meta name="theme-color" content="#059669">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
    rel="stylesheet">
  <script src='https://unpkg.com/lucide@latest'></script>
  <script src='https://unpkg.com/html5-qrcode@2.3.4/html5-qrcode.min.js'></script>
  <script src='https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js'></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class='student-page'>
    <div class='att-box'>
      <div class='att-header' id='student-header'>
        <div id='student-logo-container'
          style='display:flex; justify-content:center; align-items:center; margin-bottom:14px;'>
          <img src='icon-192.png' alt='Logo Yayasan Darul Ulum Islamiyyah'
            style='width:72px; height:72px; object-fit:contain; border-radius:16px; box-shadow:0 6px 16px rgba(0,0,0,0.08); background:#ffffff; padding:5px;'>
        </div>
        <h1>Yayasan Darul Ulum Islamiyyah</h1>
        <p>Portal Absensi Digital</p>
      </div>
      <div class='att-body' id='student-content'></div>
    </div>
    <div style="position:absolute; bottom:15px; right:15px; cursor:pointer; opacity:0.3; padding:10px;"
      onclick="checkAdmin()">
      <i data-lucide="lock" style="width:16px; color:#fff;"></i>
    </div>
  </div>
  <div class='toast-container' id='toasts'></div>

  <script src="api_connector.js?v=3"></script>
  <script src="student.js?v=3"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW terdaftar!', reg.scope))
          .catch(err => console.error('SW gagal:', err));
      });
    }

    function checkAdmin() {
      var pin = prompt("Masukkan PIN Admin:");
      // PIN sementara adalah 123456 (Bisa Anda ganti nanti di skrip jika perlu)
      if (pin === "123456") {
        window.location.href = "admin.html";
      } else if (pin !== null) {
        alert("PIN Salah!");
      }
    }
  </script>
</body>

</html>

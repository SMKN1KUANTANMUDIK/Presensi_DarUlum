<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
  <title>Presensi — SMKN 1 Kuantan Mudik</title>

  <meta name="description" content="Sistem Monitoring Presensi Siswa Realtime SMKN 1 Kuantan Mudik" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Presensi" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="application-name" content="Presensi" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Terapkan tema sebelum paint pertama supaya tidak ada kedipan putih -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('presensi-theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
  <script type="module" crossorigin src="./assets/index-DhtE0ouf.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/style-Dgn_Ko6f.css">
</head>
<body class="h-full bg-canvas text-ink antialiased">
  <div id="root" class="min-h-full"></div>

  <!--
    Jaring pengaman: kalau aplikasi dibuka langsung dari file:// (double click),
    browser memblokir ES module sehingga React tidak bisa jalan. Tampilkan
    petunjuk yang jelas, bukan halaman kosong.
  -->
  <script>
    (function () {
      function showHelp(message) {
        if (document.getElementById('boot-help')) return;
        var box = document.createElement('div');
        box.id = 'boot-help';
        box.style.cssText =
          'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;' +
          'padding:20px;background:#f4f6fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#0b1220;text-align:center;box-sizing:border-box';
        box.innerHTML =
          '<div style="box-sizing:border-box;width:100%;max-width:380px;background:#fff;border:1px solid #e4eaf3;border-radius:24px;padding:26px 22px;box-shadow:0 24px 60px -30px rgba(15,23,42,.45)">' +
          '<div style="width:52px;height:52px;margin:0 auto 16px;border-radius:16px;background:#e8efff;display:flex;align-items:center;justify-content:center;font-size:26px">⚠️</div>' +
          '<h1 style="font-size:19px;margin:0 0 8px">Aplikasi perlu dibuka lewat server</h1>' +
          '<p style="font-size:13.5px;line-height:1.6;color:#64748b;margin:0 0 18px">' +
          message +
          '</p>' +
          '<div style="background:#f1f5f9;border-radius:14px;padding:12px 14px;text-align:left;font-size:12.5px;line-height:1.7;color:#0b1220">' +
          '<div><b>1.</b> Buka terminal di folder aplikasi</div>' +
          '<div><b>2.</b> Jalankan <code style="background:#e2e8f0;padding:1px 6px;border-radius:6px">npm run serve</code></div>' +
          '<div><b>3.</b> Buka <code style="background:#e2e8f0;padding:1px 6px;border-radius:6px">http://localhost:8080</code></div>' +
          '</div>' +
          '<p style="font-size:11.5px;color:#94a3b8;margin:16px 0 0">Atau unggah folder <b>dist</b> ke hosting HTTPS (Netlify / GitHub Pages) agar bisa dipasang di HP.</p>' +
          '<button onclick="location.reload()" style="margin-top:14px;width:100%;border:0;border-radius:12px;background:#2563eb;color:#fff;font-size:13.5px;font-weight:700;padding:11px 14px;cursor:pointer">Muat ulang halaman</button>' +
          '</div>';
        document.body.appendChild(box);
      }

      if (location.protocol === 'file:') {
        showHelp('Halaman ini dibuka langsung dari file komputer (<b>file://</b>). Browser memblokir pemuatan aplikasi dan pemasangan PWA pada alamat seperti ini.');
        return;
      }

      window.addEventListener('load', function () {
        // Beri waktu cukup untuk jaringan lambat / HP kelas bawah.
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.children.length === 0 && !document.getElementById('boot-help')) {
            showHelp('Aplikasi gagal dimuat. Periksa koneksi internet lalu muat ulang halaman. Jika masih gagal, pastikan semua file hasil build (folder dist) terunggah lengkap.');
          }
        }, 6000);
      });
    })();
  </script>

</body>
</html>
